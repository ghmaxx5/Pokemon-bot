name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Secret
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "::error::HF_TOKEN secret is missing! Please go to Settings -> Secrets and variables -> Actions and add 'HF_TOKEN' with your Hugging Face write token."
            exit 1
          fi

      - name: Push to Hugging Face
        run: |
          git push --force https://ghmax5:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/ghmax5/cybermon main
